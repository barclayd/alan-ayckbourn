name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run types
      - run: bun run test
      - run: bun run build
      # Every internal link resolves to a built file. Cheap, and the failure it
      # catches — a rewritten scrape link pointing at nothing — is invisible
      # until someone clicks it.
      - run: bun run links
