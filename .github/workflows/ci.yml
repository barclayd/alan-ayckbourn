name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR check is wasted work worth cancelling; a superseded deploy is
  # a half-uploaded release, so runs on main queue behind each other instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run types
      - run: bun run test
      - run: bun run build
      # Every internal link resolves to a built file. Cheap, and the failure it
      # catches — a rewritten scrape link pointing at nothing — is invisible
      # until someone clicks it.
      - run: bun run links

      # Production deploy, in the same job as the checks that gate it: wrangler
      # ships the `dist` the build above just made, so a separate job would mean
      # either rebuilding 2,900 pages or passing them through an artifact. The
      # step is unreachable unless every check passed — a step failure ends the
      # job — which is the ordering we want anyway.
      #
      # `bunx wrangler` rather than cloudflare/wrangler-action: wrangler is
      # already a devDependency at a pinned version, installed two steps up.
      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
